name: Feature request
description: Something devlink could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where devlink gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your idea, if you have one. Alternatives you considered are welcome too.
