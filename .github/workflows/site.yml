name: Site

on:
  push:
    branches: [main]
    # Everything the site is built from: its own sources, the CLI's help text, the menu bar app's
    # screenshots, the dependencies and the build setup.
    paths:
      - apps/site/**
      - packages/dryfit/src/cli/main.ts
      - apps/menubar/Tests/DryfitMenuTests/__Snapshots__/**
      - package-lock.json
      - .nvmrc
      - .github/actions/setup/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions: {}

# Deploys queue rather than cancel, so a deploy is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build -w @dryfit/site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
